<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050914"><title>Perfil | A1M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.profile-page{min-height:100vh;position:relative;display:grid;place-items:center;padding:38px 18px;isolation:isolate}
.profile-page::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--profile-bg,linear-gradient(135deg,#06152b,#020611)) center/cover no-repeat}
.profile-page::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.48),rgba(1,5,14,.88));backdrop-filter:blur(3px)}
.public-card{width:min(760px,100%);overflow:hidden;border:1px solid #168cff66;border-radius:22px;background:rgba(3,10,22,.82);box-shadow:0 25px 100px #000b;backdrop-filter:blur(16px);text-align:center}
.public-banner{height:clamp(170px,32vw,290px);background:linear-gradient(120deg,#06152b,#087dff55) center/cover no-repeat}
.public-content{padding:0 30px 36px}.public-avatar{width:124px;height:124px;object-fit:cover;border-radius:50%;border:4px solid #168cff;background:#07101e;margin-top:-64px;box-shadow:0 0 35px #087dff88}
.public-content h1{font:800 clamp(24px,5vw,38px) Unbounded,sans-serif;margin:18px 0 10px;overflow-wrap:anywhere}
.public-bio{max-width:560px;margin:18px auto;color:#c0cde0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.public-links{margin:24px 0}.music-control{margin-top:22px;display:inline-flex;align-items:center;gap:10px}.music-note{font-size:11px;color:#9aabc2;margin-top:12px}
.back-link{position:fixed;top:18px;left:18px;z-index:3}
@media(max-width:520px){.public-content{padding:0 18px 28px}.public-avatar{width:104px;height:104px;margin-top:-54px}}
</style>
</head>
<body>
<a class="btn btn-outline back-link" href="javascript:history.back()">← Voltar</a>
<main class="profile-page" id="profile-page"><article class="public-card">
<div class="public-banner" id="public-banner"></div><div class="public-content">
<img class="public-avatar" id="public-avatar" src="images/a1m-logo.png" alt="Foto do perfil">
<h1 id="public-name">Carregando perfil...</h1><span class="profile-category" id="public-category"></span>
<p class="public-bio" id="public-bio"></p><div class="socials public-links" id="public-links"></div><div id="music-area"></div>
</div></article></main><audio id="profile-audio" loop preload="none"></audio>
<script src="supabase-config.js"></script><script>
(()=>{
 const cfg=window.A1M_CONFIG||{},id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const validLink=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
 async function start(){
  if(!cfg.url||!cfg.anonKey||!id){$('public-name').textContent='Perfil não encontrado';$('public-bio').textContent='Não foi possível localizar este perfil.';return}
  try{
   const url=cfg.url.replace(/\/$/,'')+'/rest/v1/member_profiles?select=id,display_name,discord,bio,avatar_url,banner_url,instagram_url,twitter_url,other_url,music_url,is_member&id=eq.'+encodeURIComponent(id)+'&limit=1';
   const res=await fetch(url,{headers:{apikey:cfg.anonKey,Authorization:'Bearer '+cfg.anonKey}});
   if(!res.ok)throw Error('Falha ao carregar perfil');
   const rows=await res.json(),p=rows[0];if(!p)throw Error('Perfil não encontrado');
   document.title=p.display_name+' | A1M';$('public-name').textContent=p.display_name||'Perfil A1M';
   $('public-category').textContent=p.is_member?'MEMBRO A1M':'CONVIDADO / EXTERNO';
   $('public-bio').textContent=p.bio||(p.is_member?'Membro da tropa A1M':'Perfil externo');
   $('public-avatar').src=p.avatar_url||'images/a1m-logo.png';
   if(p.banner_url){const bg='url("'+p.banner_url.replace(/["\\]/g,'')+'")';$('public-banner').style.backgroundImage=bg;$('profile-page').style.setProperty('--profile-bg',bg)}
   const links=[];if(p.discord)links.push('<a target="_blank" rel="noopener noreferrer" href="https://discord.com/users/'+encodeURIComponent(p.discord)+'">Discord</a>');
   for(const [key,label] of [['instagram_url','Instagram'],['twitter_url','X / Twitter'],['other_url','Link']]){const href=validLink(p[key]);if(href)links.push('<a target="_blank" rel="noopener noreferrer" href="'+esc(href)+'">'+label+'</a>')}
   $('public-links').innerHTML=links.join('');
   if(p.music_url){const audio=$('profile-audio');audio.src=p.music_url;
    $('music-area').innerHTML='<button class="btn btn-primary music-control" id="music-play">♫ Tocar música do perfil</button><p class="music-note">Música escolhida pelo dono do perfil.</p>';
    const play=()=>audio.play().then(()=>{$('music-play').textContent='♫ Música tocando'}).catch(()=>{$('music-play').textContent='♫ Tocar música do perfil'});
    $('music-play').addEventListener('click',play);play();
   }
  }catch(e){$('public-name').textContent='Perfil indisponível';$('public-bio').textContent=e.message}
 }
 start();
})();
</script></body></html>
